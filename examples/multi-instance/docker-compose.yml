version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  server-instance-1:
    build:
      context: ../..
      dockerfile: examples/multi-instance/Dockerfile
    environment:
      - PORT=3001
      - INSTANCE_ID=Node-1
      - REDIS_URL=redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      - redis

  server-instance-2:
    build:
      context: ../..
      dockerfile: examples/multi-instance/Dockerfile
    environment:
      - PORT=3002
      - INSTANCE_ID=Node-2
      - REDIS_URL=redis://redis:6379
    ports:
      - "3002:3002"
    depends_on:
      - redis
